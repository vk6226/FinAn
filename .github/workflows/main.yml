# ============================================================
# FinAn — Full-Stack CI/CD Pipeline
# Triggers on every push/PR to main and develop branches.
# Runs parallel jobs: Lint, Security Scan, Test, Build & Deploy.
# ============================================================

name: FinAn CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

# ────────────────────────────────────────────────────────────
# JOB 1: Frontend Linting & Type Checking (Next.js / React)
# ────────────────────────────────────────────────────────────
jobs:
  frontend-lint:
    name: 🔍 Frontend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npx eslint . --max-warnings 0

  # ────────────────────────────────────────────────────────────
  # JOB 2: Backend Linting & Code Quality (Python / FastAPI)
  # ────────────────────────────────────────────────────────────
  backend-lint:
    name: 🐍 Backend Lint & Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint

      - name: Run Flake8
        run: flake8 . --max-line-length=120 --statistics

      - name: Run PyLint
        run: pylint --disable=C0114,C0115,C0116 --fail-under=7.0 *.py engine/*.py

  # ────────────────────────────────────────────────────────────
  # JOB 3: Security Vulnerability Scanning (Bandit + npm audit)
  # ────────────────────────────────────────────────────────────
  security-scan:
    name: 🛡️ Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit security scan on backend
        run: bandit -r backend/ -ll -ii

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run npm audit on frontend
        run: npm audit --audit-level=high
        continue-on-error: true

  # ────────────────────────────────────────────────────────────
  # JOB 4: Backend Unit Tests with Coverage (pytest)
  # ────────────────────────────────────────────────────────────
  backend-test:
    name: 🧪 Backend Tests & Coverage
    runs-on: ubuntu-latest
    needs: [backend-lint]
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run pytest with coverage
        run: |
          pytest --cov=. --cov-report=term-missing --cov-fail-under=70 -v

  # ────────────────────────────────────────────────────────────
  # JOB 5: Docker Build Verification
  # ────────────────────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build Verification
    runs-on: ubuntu-latest
    needs: [frontend-lint, backend-test, security-scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        run: |
          docker build -f Dockerfile.backend -t finan-backend:ci .

      - name: Build Frontend Docker Image
        run: |
          docker build -f Dockerfile.frontend -t finan-frontend:ci .
        env:
          DATABASE_URL: "postgresql://finan:finan@localhost:5432/finan_db"

      - name: Verify images built successfully
        run: |
          docker images | grep finan
          echo "✅ All Docker images built successfully"

  # ────────────────────────────────────────────────────────────
  # JOB 6: Deploy to Production (only on push to main)
  # ────────────────────────────────────────────────────────────
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Frontend to Vercel
        run: echo "🌐 Vercel auto-deploys from GitHub webhook on main push"

      - name: Deploy Backend to Railway
        run: echo "🚂 Railway auto-deploys from GitHub webhook on main push"

      - name: Tag release
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          echo "✅ Production deployment triggered successfully"
