version: '3.8'

services:
  # ---------------------------------------- #
  # 1. PostgreSQL Database (For Prisma)
  # ---------------------------------------- #
  postgres:
    image: postgres:15-alpine
    container_name: finan_postgres
    restart: always
    environment:
      POSTGRES_USER: finan_user
      POSTGRES_PASSWORD: finan_password
      POSTGRES_DB: finan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finan_user -d finan_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------- #
  # 2. MongoDB Database (For FastAPI)
  # ---------------------------------------- #
  mongodb:
    image: mongo:7
    container_name: finan_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  # ---------------------------------------- #
  # 3. Next.js Frontend
  # ---------------------------------------- #
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: finan_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://finan_user:finan_password@postgres:5432/finan_db
      # If your Next.js app needs to call backend APIs directly:
      - NEXT_PUBLIC_API_URL=http://localhost:10000

  # ---------------------------------------- #
  # 4. FastAPI Backend
  # ---------------------------------------- #
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finan_backend
    restart: always
    ports:
      - "10000:10000"
    depends_on:
      - mongodb
    environment:
      - PORT=10000
      - MONGODB_URL=mongodb://mongodb:27017

volumes:
  postgres_data:
  mongodb_data:
